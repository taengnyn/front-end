<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Реєстрація</title>
  <link rel="stylesheet" href="styles/login_base.css">
</head>
<body>
  <div class="container">
    <h1>Реєстрація</h1>
    <form id="signup-form">
      <!-- Частина 1: Логін і пароль -->
      <div id="signup-step-1">
        <div class="form-group">
          <label for="signup-username">Логін:</label>
          <input type="text" id="signup-username" name="signup-username" required>
        </div>
        <div class="form-group">
          <label for="signup-password">Пароль:</label>
          <input type="password" id="signup-password" name="signup-password" required>
        </div>
        <button type="button" id="next-btn" class="next-btn">Далі</button>
      </div>
      <!-- Частина 2: Параметри користувача -->
      <div id="signup-step-2" style="display: none;">
        <div class="form-group">
          <label for="age">Вік (10-100):</label>
          <input type="range" id="age" name="age" min="10" max="100" value="25">
          <span id="age-value">25</span>
        </div>
        <div class="form-group">
          <label for="height">Зріст (см, 100-250):</label>
          <input type="range" id="height" name="height" min="100" max="250" value="170">
          <span id="height-value">170</span>
        </div>
        <div class="form-group">
          <label for="weight">Вага (кг, 30-200):</label>
          <input type="range" id="weight" name="weight" min="30" max="200" value="70">
          <span id="weight-value">70</span>
        </div>
        <div class="form-group">
          <label for="activityLevel">Рівень активності:</label>
          <select id="activityLevel" name="activityLevel">
            <option value="low">Низький</option>
            <option value="moderate">Помірний</option>
            <option value="high">Високий</option>
            <option value="very-high">Дуже високий</option>
          </select>
        </div>
        <div class="form-group">
          <label for="goal">Мета:</label>
          <select id="goal" name="goal">
            <option value="lose-weight">Схуднення</option>
            <option value="healthy-lifestyle">Здоровий спосіб життя</option>
            <option value="maintain-weight">Підтримка ваги</option>
            <option value="gain-weight">Набір ваги</option>
          </select>
        </div>
        <div class="form-group">
          <label for="gender">Стать:</label>
          <select id="gender" name="gender">
            <option value="male">Чоловіча</option>
            <option value="female">Жіноча</option>
          </select>
        </div>
        <button type="submit" class="signup-btn">Зареєструватись</button>
      </div>
    </form>
    <a href="logging.html">Повернутися до входу</a>
  </div>
  <script src="JS/login.js"></script>
</body>
</html>
