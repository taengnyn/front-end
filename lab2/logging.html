<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Логін</title>
  <link rel="stylesheet" href="styles/login_base.css">
</head>
<body>
  <div class="container">
    <h1>Логін</h1>
    <form id="login-form">
      <div class="form-group">
        <label for="username">Логін:</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="form-group">
        <label for="password">Пароль:</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="login-btn">Увійти</button>
      <button type="button" id="admin-login-btn" class="admin-btn">Увійти як адміністратор</button>

      <p class="register-link">Ще не приєднались? <a href="signup.html">Зареєструватись</a></p>

    </form>
  </div>
  <script src="JS/login.js"></script>
</body>
</html>
